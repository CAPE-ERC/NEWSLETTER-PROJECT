[project]
name = "cape-newsletter"
version = "0.1.0"
description = "Multi-agent pipeline for automating the CAPE Economic Performance and Prospect Bulletin"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "python-docx>=1.1.0",
    "pdfplumber>=0.11.0",
    "pandas>=2.2.0",
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "matplotlib>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.6.0",
]

[tool.ruff]
line-length = 100
